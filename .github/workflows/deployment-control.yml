name: 🎛️ 部署控制面板

on:
  workflow_dispatch:
    inputs:
      spa_deploy:
        description: '🔄 SPA一体化自动部署'
        required: true
        type: choice
        options:
          - '🟢 开启'
          - '🔴 关闭'
          - '📊 查看当前状态'
        default: '📊 查看当前状态'

      backend_deploy:
        description: '⚙️ 后端分离自动部署'
        required: true
        type: choice
        options:
          - '🟢 开启'
          - '🔴 关闭'
          - '📊 查看当前状态'
        default: '📊 查看当前状态'

      frontend_deploy:
        description: '🎨 前端分离自动部署'
        required: true
        type: choice
        options:
          - '🟢 开启'
          - '🔴 关闭'
          - '📊 查看当前状态'
        default: '📊 查看当前状态'

jobs:
  control-deployments:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 只需要写文件权限（默认就有）

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 📋 读取当前配置状态
        id: read_config
        run: |
          if [ -f .github/deployment-config.json ]; then
            SPA_STATUS=$(jq -r '.spa_deploy' .github/deployment-config.json)
            BACKEND_STATUS=$(jq -r '.backend_deploy' .github/deployment-config.json)
            FRONTEND_STATUS=$(jq -r '.frontend_deploy' .github/deployment-config.json)
          else
            SPA_STATUS="false"
            BACKEND_STATUS="false"
            FRONTEND_STATUS="false"
          fi

          echo "spa_status=$SPA_STATUS" >> $GITHUB_OUTPUT
          echo "backend_status=$BACKEND_STATUS" >> $GITHUB_OUTPUT
          echo "frontend_status=$FRONTEND_STATUS" >> $GITHUB_OUTPUT

          echo "======================================"
          echo "📊 当前自动部署状态"
          echo "======================================"
          echo ""
          echo "🔄 SPA一体化部署: $([ "$SPA_STATUS" = "true" ] && echo '🟢 已开启' || echo '🔴 已关闭')"
          echo "⚙️ 后端分离部署: $([ "$BACKEND_STATUS" = "true" ] && echo '🟢 已开启' || echo '🔴 已关闭')"
          echo "🎨 前端分离部署: $([ "$FRONTEND_STATUS" = "true" ] && echo '🟢 已开启' || echo '🔴 已关闭')"
          echo ""
          echo "======================================"

      - name: 🔄 更新 SPA 一体化部署配置
        if: github.event.inputs.spa_deploy != '📊 查看当前状态'
        run: |
          ACTOR="${{ github.actor }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [[ "${{ github.event.inputs.spa_deploy }}" == "🟢 开启" ]]; then
            echo "✅ 正在开启 SPA 一体化自动部署..."
            jq --arg user "$ACTOR" --arg time "$TIMESTAMP" \
              '.spa_deploy = true | .last_updated = $time | .updated_by = $user' \
              .github/deployment-config.json > .github/deployment-config.json.tmp
            mv .github/deployment-config.json.tmp .github/deployment-config.json
            echo "🎉 SPA 一体化自动部署已开启！"
          else
            echo "⏸️ 正在关闭 SPA 一体化自动部署..."
            jq --arg user "$ACTOR" --arg time "$TIMESTAMP" \
              '.spa_deploy = false | .last_updated = $time | .updated_by = $user' \
              .github/deployment-config.json > .github/deployment-config.json.tmp
            mv .github/deployment-config.json.tmp .github/deployment-config.json
            echo "✅ SPA 一体化自动部署已关闭！"
          fi

      - name: ⚙️ 更新后端分离部署配置
        if: github.event.inputs.backend_deploy != '📊 查看当前状态'
        run: |
          ACTOR="${{ github.actor }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [[ "${{ github.event.inputs.backend_deploy }}" == "🟢 开启" ]]; then
            echo "✅ 正在开启后端分离自动部署..."
            jq --arg user "$ACTOR" --arg time "$TIMESTAMP" \
              '.backend_deploy = true | .last_updated = $time | .updated_by = $user' \
              .github/deployment-config.json > .github/deployment-config.json.tmp
            mv .github/deployment-config.json.tmp .github/deployment-config.json
            echo "🎉 后端分离自动部署已开启！"
          else
            echo "⏸️ 正在关闭后端分离自动部署..."
            jq --arg user "$ACTOR" --arg time "$TIMESTAMP" \
              '.backend_deploy = false | .last_updated = $time | .updated_by = $user' \
              .github/deployment-config.json > .github/deployment-config.json.tmp
            mv .github/deployment-config.json.tmp .github/deployment-config.json
            echo "✅ 后端分离自动部署已关闭！"
          fi

      - name: 🎨 更新前端分离部署配置
        if: github.event.inputs.frontend_deploy != '📊 查看当前状态'
        run: |
          ACTOR="${{ github.actor }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [[ "${{ github.event.inputs.frontend_deploy }}" == "🟢 开启" ]]; then
            echo "✅ 正在开启前端分离自动部署..."
            jq --arg user "$ACTOR" --arg time "$TIMESTAMP" \
              '.frontend_deploy = true | .last_updated = $time | .updated_by = $user' \
              .github/deployment-config.json > .github/deployment-config.json.tmp
            mv .github/deployment-config.json.tmp .github/deployment-config.json
            echo "🎉 前端分离自动部署已开启！"
          else
            echo "⏸️ 正在关闭前端分离自动部署..."
            jq --arg user "$ACTOR" --arg time "$TIMESTAMP" \
              '.frontend_deploy = false | .last_updated = $time | .updated_by = $user' \
              .github/deployment-config.json > .github/deployment-config.json.tmp
            mv .github/deployment-config.json.tmp .github/deployment-config.json
            echo "✅ 前端分离自动部署已关闭！"
          fi

      - name: 📊 显示更新后的状态
        run: |
          NEW_SPA_STATUS=$(jq -r '.spa_deploy' .github/deployment-config.json)
          NEW_BACKEND_STATUS=$(jq -r '.backend_deploy' .github/deployment-config.json)
          NEW_FRONTEND_STATUS=$(jq -r '.frontend_deploy' .github/deployment-config.json)
          LAST_UPDATED=$(jq -r '.last_updated' .github/deployment-config.json)
          UPDATED_BY=$(jq -r '.updated_by' .github/deployment-config.json)

          echo ""
          echo "======================================"
          echo "✅ 配置更新完成"
          echo "======================================"
          echo ""
          echo "🔄 SPA一体化部署: $([ "$NEW_SPA_STATUS" = "true" ] && echo '🟢 已开启' || echo '🔴 已关闭')"
          echo "⚙️ 后端分离部署: $([ "$NEW_BACKEND_STATUS" = "true" ] && echo '🟢 已开启' || echo '🔴 已关闭')"
          echo "🎨 前端分离部署: $([ "$NEW_FRONTEND_STATUS" = "true" ] && echo '🟢 已开启' || echo '🔴 已关闭')"
          echo ""
          echo "📅 最后更新: $LAST_UPDATED"
          echo "👤 更新者: $UPDATED_BY"
          echo ""
          echo "======================================"

          # 检测多重部署警告
          ENABLED_COUNT=0
          [ "$NEW_SPA_STATUS" = "true" ] && ((ENABLED_COUNT++))
          [ "$NEW_BACKEND_STATUS" = "true" ] && ((ENABLED_COUNT++))
          [ "$NEW_FRONTEND_STATUS" = "true" ] && ((ENABLED_COUNT++))

          if [ $ENABLED_COUNT -gt 1 ]; then
            echo ""
            echo "⚠️ 警告：检测到多个部署方式同时启用！"
            echo "建议只启用一种部署方式以避免重复部署。"
            echo ""
          fi

      - name: 💾 提交配置变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 检查是否有变更
          if git diff --quiet .github/deployment-config.json; then
            echo "📝 配置未变更，无需提交"
          else
            echo "📝 检测到配置变更，准备提交..."

            # 读取当前配置用于提交信息
            SPA_STATUS=$(jq -r '.spa_deploy' .github/deployment-config.json)
            BACKEND_STATUS=$(jq -r '.backend_deploy' .github/deployment-config.json)
            FRONTEND_STATUS=$(jq -r '.frontend_deploy' .github/deployment-config.json)

            git add .github/deployment-config.json

            # 创建提交信息
            COMMIT_MSG="chore: update deployment configuration via control panel"$'\n\n'
            COMMIT_MSG+="🔄 SPA Deploy: $SPA_STATUS"$'\n'
            COMMIT_MSG+="⚙️ Backend Deploy: $BACKEND_STATUS"$'\n'
            COMMIT_MSG+="🎨 Frontend Deploy: $FRONTEND_STATUS"$'\n\n'
            COMMIT_MSG+="Updated by: ${{ github.actor }}"

            git commit -m "$COMMIT_MSG"

            echo "📤 推送到远程仓库..."
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ 配置已提交并推送到仓库"
          fi
